version: '3.9'

services:
  db:
    image: postgres:16
    container_name: cloth_inventory_db
    restart: always
    environment:
      POSTGRES_USER: cloth_user
      POSTGRES_PASSWORD: cloth_pass
      POSTGRES_DB: cloth_inventory
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: